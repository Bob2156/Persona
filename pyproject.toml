[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "persona-ai"
version = "0.1.0"
description = "Real-time user personality profiling middleware for any LLM."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Persona Team"},
]
keywords = ["ai", "llm", "personalization", "profiling", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Zero required dependencies — stdlib only for the core
dependencies = []

[project.optional-dependencies]
# Optional: for customers who want the CLI demo
cli = []
# Optional: for running tests
dev = ["pytest"]

[project.scripts]
persona-demo = "persona.cli:run_cli"

[tool.setuptools.packages.find]
include = ["persona*"]
